openapi: 3.1.0
info:
  title: Roots of Brazil — API do Corpus Fundador
  version: 1.1.0
  summary: Camada de acesso somente leitura ao Corpus Fundador v1.1.
  description: 'Implementa a Especificação Conceitual da API v1.1. Serve as 381 entidades e 1.585 relações
    do Corpus Fundador, homologado na Auditoria Sprint 2.


    **Somente leitura.** Não há POST, PUT ou DELETE: o corpus é curado offline (mineração + auditoria)
    e publicado como snapshot versionado, não editado pela API — Especificação Conceitual, Seção 6.


    **Duas origens de dado.** Listagem e detalhe vêm do banco relacional (Ordem 2); navegação entre entidades
    e busca global vêm do banco de grafo (Ordem 3). A divisão está documentada em cada operação.


    **Fidelidade ao corpus.** Toda propriedade de resposta corresponde 1:1 a uma coluna do Dicionário
    de Dados Oficial v1.2 — sem agregação, transformação ou dado derivado além do já calculado no corpus
    (Especificação Conceitual, Seção 7).


    **Confiabilidade sempre visível.** Nenhuma resposta esconde o grau de certeza: `confiabilidade` acompanha
    toda entidade, e `peso`, `fonte`, `pagina` e `observacoes` acompanham toda relação.


    **Acesso.** Aberto, sem chave de API. Limite de 100 requisições por minuto por IP; acima disso, 429.
    CORS liberado para qualquer origem.'
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Roots of Brazil
servers:
- url: http://localhost:8000
  description: Desenvolvimento local.
tags:
- name: Ingrediente
  description: 'Origem: aba ''1. Catálogo Ingredientes''.'
- name: Receita
  description: 'Origem: aba ''2. Catálogo Receitas''.'
- name: Tecnica
  description: 'Origem: aba ''3. Catálogo Técnicas''.'
- name: Povo
  description: 'Origem: aba ''4. Catálogo Povos''.'
- name: Territorio
  description: 'Origem: aba ''5. Catálogo Territórios''.'
- name: Bioma
  description: 'Origem: aba ''12. Catálogo Biomas''.'
- name: Patrimonio
  description: 'Origem: aba ''6. Catálogo Patrimônio''.'
- name: Relações
  description: 'Origem: aba ''11. RELACOES''.'
- name: Busca
  description: Busca global sobre o índice full-text do grafo.
- name: Operação
  description: Endpoints de infraestrutura.
