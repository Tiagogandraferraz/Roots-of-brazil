      - $ref: '#/components/parameters/Bioma'
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: Página de ingredientes.
          headers:
            ETag:
              description: Hash forte do corpo, para revalidação com If-None-Match.
              schema:
                type: string
            Cache-Control:
              description: O corpus muda por versão, não em tempo real.
              schema:
                type: string
            X-RateLimit-Limit:
              description: Requisições permitidas por janela.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requisições restantes na janela.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaIngrediente'
        '304':
          description: Não modificado — o ETag enviado ainda vale.
        '400':
          description: Parâmetro de query inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de 100 requisições por minuto por IP excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          headers:
            Retry-After:
              description: Segundos até a próxima janela.
              schema:
                type: integer
        '500':
          description: Erro não tratado no servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
