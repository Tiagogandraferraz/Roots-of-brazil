[tool.poetry]
name = "roots-of-brazil"
version = "0.1.0"
description = "Roots of Brazil — API da Platform, servindo o Corpus Fundador via ontologia, banco relacional e banco de grafo"
authors = ["Roots of Brazil"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
sqlalchemy = "^2.0"
alembic = "^1.13"
pydantic = "^2.9"
neo4j = "^5.24"
sentence-transformers = "^3.1"
faiss-cpu = "^1.8"
uvicorn = { extras = ["standard"], version = "^0.31" }
python-dotenv = "^1.0"
mcp = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.11"
bandit = "^1.7"
safety = "^3.2"
pip-audit = "^2.7"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

# Os módulos de rota e o bootstrap da aplicação ficam fora do modo estrito.
# Motivo: os decoradores do FastAPI (@router.get) não são tipados de forma que
# o mypy consiga preservar a assinatura da função decorada, e sob `strict` isso
# gera `untyped-decorator` em toda rota — um erro sobre a biblioteca, não sobre
# o código do projeto. A lógica de domínio (catálogo, parâmetros, erros,
# serialização e os dois repositórios) continua sob `strict` integral, e é onde
# a checagem de tipos tem valor real.
[[tool.mypy.overrides]]
module = ["app.main", "app.api.routers.*"]
disallow_untyped_decorators = false

# `BaseHTTPMiddleware` do Starlette resolve como Any quando os stubs da
# biblioteca não estão disponíveis no ambiente, e sob `strict` herdar de Any é
# erro. Não é um problema do nosso código: os dois middlewares têm `dispatch`
# totalmente anotado. Restrito a este módulo para não afrouxar nada mais.
[[tool.mypy.overrides]]
module = ["app.core.middleware"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
