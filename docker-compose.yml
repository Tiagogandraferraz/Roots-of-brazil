services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Community Edition só tem um banco de usuário; explicitado para o driver
      # não depender do default implícito. Ver app/database/neo4j.py.
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banco de grafo da Ordem 3. Versão fixada na linha LTS: `neo4j:5` flutua e
  # traria mudança de minor sem aviso, o que é exatamente o que não se quer num
  # serviço que a carga e os testes de integração assumem estável.
  # Community Edition: sem constraints de existência/node key/relação — ver a
  # nota em app/models/grafo.py sobre o que é validado no banco e o que é
  # validado no ETL.
  neo4j:
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      # Repetidos como variáveis simples para o healthcheck poder usá-las
      # (NEO4J_AUTH é um par user/senha, não dá para reaproveitar direto).
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Aceitar a licença é obrigatório a partir do 5.x, inclusive no Community.
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      # O corpus é pequeno (381 nós / 1.585 arestas): o page cache cabe folgado
      # em 512M. Heap fixado (inicial = máximo) para evitar pausa de realocação
      # durante a carga em lote do ETL.
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt — é por aqui que a API e o ETL falam
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      # Consulta real via Bolt, não apenas HTTP em 7474: o servidor responde na
      # porta HTTP antes de aceitar Cypher, e `depends_on: service_healthy` na
      # API precisa significar "pronto para consultar", não "processo subiu".
      test: ["CMD-SHELL", "cypher-shell -u \"$$NEO4J_USER\" -p \"$$NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      # A primeira subida cria os stores e roda a migração de formato; sem esta
      # janela o healthcheck esgota as tentativas antes de o banco ficar pronto.
      start_period: 60s

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
