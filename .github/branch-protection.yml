# Documentação de referência das regras de proteção de branch
# aplicadas manualmente em Settings > Branches no GitHub.
branch_protection_rules:
  main:
    required_pull_request_reviews:
      required_approving_review_count: 1
    required_status_checks:
      strict: true
      contexts:
        - test
    enforce_admins: true
    allow_force_pushes: false
    allow_deletions: false
  develop:
    required_status_checks:
      strict: true
      contexts:
        - test
    allow_force_pushes: false
    allow_deletions: false
